<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Level Up Dojo</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0c0a1d; color: #f6f2ff; font-family: system-ui, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; box-sizing: border-box; }
      .logo { width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, #ff4d94, #8b5cf6); display: flex; align-items: center; justify-content: center; }
      h1 { margin: 28px 0 8px; font-size: 24px; }
      p { margin: 0; max-width: 300px; color: #bdb5e0; font-size: 15px; line-height: 1.5; }
      button { margin-top: 28px; border: 0; border-radius: 12px; padding: 14px 28px; font-size: 16px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #ff4d94, #8b5cf6); }
    </style>
  </head>
  <body>
    <!-- Shown by the native app only when the Level Up Dojo site can't be reached. -->
    <main>
      <div class="logo" aria-hidden="true">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 13.5 12 6.5l7 7" /><path d="M5 19.5l7-7 7 7" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>Level Up Dojo needs an internet connection to load. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
